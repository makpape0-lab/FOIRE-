  $("t").innerHTML="<tr><th>Réf.</th><th>Exposant</th><th>Formule</th><th>Statut</th><th>Versé</th><th>Stand</th><th></th></tr>"+VIEW.map(x=>`<tr><td>${esc(x.numero)}<br><small class="mu">${fmt(x.created_at)}</small></td><td><b>${esc(x.organisation)}</b><br>${esc(x.responsable)} · ${esc(x.commune)}<br><small class="mu">${esc((x.secteurs||[]).join(", "))}</small></td><td>${esc(pn(x.formule))}</td><td><span class="chip ${sc(x.statut)}">${esc(x.statut)}</span></td><td>${fcfa(x.montant_verse)}</td><td>${esc(x.stand||"—")}</td><td><button class="btn s" data-v="${x.id}">Voir</button></td></tr>`).join("")}}
async function detail(id){const r=ROWS.find(x=>x.id===id),d=r.details||{},row=(a,b)=>`<div><b>${a}</b><span>${esc(b||"—")}</span></div>`,L=await urls(r.photos);
 modal(`<h3>${esc(r.numero)} – ${esc(r.organisation)}</h3><p><span class="chip ${sc(r.statut)}">${esc(r.statut)}</span></p><div class="info">${row("Responsable",r.responsable)}${row("Téléphone",r.telephone)}${row("E-mail",r.email)}${row("Commune",r.commune)}${row("Secteur(s)",(r.secteurs||[]).join(", "))}${row("Formule",pn(r.formule)+" – "+fcfa(price(r.formule)))}${row("Versé / stand",fcfa(r.montant_verse)+" · "+(r.stand||"—"))}${row("Produits / services",r.produits)}${row("Paiement prévu",r.mode_paiement)}${XF.map(x=>row(x[1],d[x[0]])).join("")}${row("Notes",r.notes)}</div><h3 style="margin-top:14px">Photographies</h3><div class="ph">${L.map((x,k)=>x.u?`<div><a href="${x.u}" target="_blank" rel="noopener"><img src="${x.u}" alt="Photo ${k+1}"></a></div>`:"").join("")||'<p class="mu">Aucune photographie.</p>'}</div>${EX&&L.length?`<p class="mu" style="font-size:13px">Clic sur une photo pour l'ouvrir et l'enregistrer.</p>`:""}${SA?`<p><button class="btn s" id="de" type="button">Modifier</button> <button class="btn d s" id="dd" type="button">Supprimer</button></p>`:""}`);
 if(!SA)return;
 $("de").onclick=()=>{modal(`<form id="ef"><h3>Modifier le dossier ${esc(r.numero)}</h3>${body(r).replace(/ hide/g,"")}<div class="f2"><label>Statut<select name="statut">${STAT.map(s=>`<option ${s===r.statut?"selected":""}>${s}</option>`).join("")}</select></label><label>Formule<select name="formule">${Object.keys(PK).map(k=>`<option value="${k}" ${k===r.formule?"selected":""}>${pn(k)}</option>`).join("")}</select></label><label>Montant versé (Fcfa)<input type="number" min="0" step="500" name="montant_verse" value="${r.montant_verse||0}"></label><label>N° de stand<input name="stand" maxlength="20" value="${esc(r.stand||"")}"></label><label class="w">Notes<textarea name="notes" rows="2" maxlength="600">${esc(r.notes||"")}</textarea></label></div><div class="err" id="ee"></div><button class="btn">Enregistrer</button></form>`);
  $("ef").onsubmit=async e=>{e.preventDefault();const f=new FormData($("ef")),u={...collect(f),statut:f.get("statut"),formule:f.get("formule"),montant_verse:Number(f.get("montant_verse"))||0,stand:String(f.get("stand")).trim(),notes:String(f.get("notes")).trim(),updated_at:new Date().toISOString()};
   if(u.statut==="Stand attribué"&&!u.stand)return $("ee").textContent="Indiquez le numéro de stand.";const x=await sb.from("faseca_inscriptions").update(u).eq("id",id);if(x.error)return $("ee").textContent=x.error.message;$("md").close();toast("Dossier mis à jour (journalisé).");admin()}};
 $("dd").onclick=async()=>{if(!confirm("Supprimer définitivement ce dossier ? Une copie reste dans le journal et pourra être restaurée."))return;const x=await sb.from("faseca_inscriptions").delete().eq("id",id);if(x.error)return toast(x.error.message);$("md").close();toast("Dossier supprimé.");admin()}}

// ---- Super admin : paramétrage ----
function tCfg(){
 $("tb").innerHTML=`<form class="card" id="cf" style="margin-top:14px"><h3>Paramétrage de la foire</h3><div class="f2">
 <label>Dates de la foire<input name="dates" value="${esc(CFG.dates)}" required></label><label>Lieu<input name="lieu" value="${esc(CFG.lieu)}" required></label>
 <label>Date limite d'inscription (heure de Dakar)<input type="datetime-local" name="limite" value="${esc(String(CFG.limite).slice(0,16))}" required></label><label>Nombre de stands disponibles<input type="number" min="1" name="stands" value="${CFG.stands}" required></label>
 <label>Tarif Pack standard (Fcfa)<input type="number" min="0" name="standard" value="${CFG.standard}" required></label><label>Tarif Pack institutionnel (Fcfa)<input type="number" min="0" name="institutionnel" value="${CFG.institutionnel}" required></label>
 <label>Téléphone de paiement (OM / Wave)<input name="tel" value="${esc(CFG.tel)}" required></label><label>Date limite du solde<input name="solde" value="${esc(CFG.solde)}" required></label></div>
 <label>Photographies de l'accueil (une adresse https:// par ligne ; sinon le visuel officiel est utilisé)<textarea name="photos" rows="3">${esc((CFG.photos||[]).join("\n"))}</textarea></label><div class="err" id="ce"></div><button class="btn">Enregistrer le paramétrage</button></form>`;
 $("cf").onsubmit=async e=>{e.preventDefault();const f=new FormData($("cf")),n={...CFG};
  ["dates","lieu","tel","solde"].forEach(k=>n[k]=String(f.get(k)).trim());["stands","standard","institutionnel"].forEach(k=>n[k]=Number(f.get(k)));n.limite=new Date(f.get("limite")+":00Z").toISOString();n.photos=String(f.get("photos")).split(/\n/).map(x=>x.trim()).filter(x=>/^https:\/\//.test(x)).slice(0,8);
  const r=await sb.from("faseca_config").upsert({id:1,data:n});if(r.error)return $("ce").textContent="Erreur : "+r.error.message;CFG=n;$("ce").className="ok";$("ce").textContent="Paramétrage enregistré."}}
async function tJr(){
 $("tb").innerHTML=`<div class="card"><h3>Journal d'activité</h3><p class="mu">200 dernières opérations. Journal en lecture seule : aucune modification ni suppression possible depuis l'application.</p><div style="overflow-x:auto"><table id="jt"><tr><td>Chargement…</td></tr></table></div></div>`;
 const r=await sb.from("faseca_journal").select("*").order("created_at",{ascending:false}).limit(200);if(r.error)return $("jt").innerHTML=`<tr><td class="err">${esc(r.error.message)}</td></tr>`;
 const df=j=>j.ancien&&j.nouveau?Object.keys(j.nouveau).filter(k=>k!=="updated_at"&&JSON.stringify(j.nouveau[k])!==JSON.stringify(j.ancien[k])).map(k=>`${k} : ${esc(JSON.stringify(j.ancien[k]).slice(0,60))} → ${esc(JSON.stringify(j.nouveau[k]).slice(0,60))}`).join("<br>"):j.operation==="création"?"Version initiale":"";
 $("jt").innerHTML="<tr><th>Date</th><th>Dossier</th><th>Opération</th><th>Par</th><th>Détail</th><th></th></tr>"+r.data.map(j=>`<tr><td>${new Date(j.created_at).toLocaleString("fr-FR")}</td><td>${esc(j.numero)}</td><td><span class="chip c2">${esc(j.operation)}</span></td><td>${esc(j.acteur)}</td><td><small>${df(j)}</small></td><td>${j.ancien?`<button class="btn s o" data-r="${j.id}">Restaurer l'ancienne version</button>`:""}</td></tr>`).join("");
 $("jt").onclick=async e=>{const b=e.target.closest("[data-r]");if(!b||!confirm("Restaurer la version précédant cette opération ?"))return;const x=await sb.rpc("faseca_restaurer",{p:b.dataset.r});toast(x.error?"Erreur : "+x.error.message:"Version restaurée.");if(!x.error)tJr()}}
async function tSp(){const r=await sb.from("faseca_support").select("*").order("created_at",{ascending:false}).limit(100);
 $("tb").innerHTML=`<div class="card"><h3>Demandes d'assistance</h3>${(r.data||[]).map(s=>`<p style="border-bottom:1px solid var(--bd);padding:8px 0;margin:0"><b>${esc(s.numero||"")}</b> · ${fmt(s.created_at)}<br>${esc(s.message)}</p>`).join("")||'<p class="mu">Aucune demande.</p>'}</div>`}
async function tUsr(){
 $("tb").innerHTML=`<div class="card"><h3>Utilisateurs, rôles et comptes</h3><p class="mu">porteur = exposant · admin = supervision en lecture seule + Excel · super_admin = tous les accès. Les mots de passe ne sont jamais visibles : « Réinitialiser » envoie un lien sécurisé à l'utilisateur.</p><div style="overflow-x:auto"><table id="ut"><tr><td>Chargement…</td></tr></table></div></div>`;
 const [r,q]=await Promise.all([sb.from("profiles").select("*").limit(500),sb.from("faseca_resets").select("*").order("created_at",{ascending:false})]);
 if(r.error)return $("ut").innerHTML=`<tr><td class="err">${esc(r.error.message)}</td></tr>`;const last={};(q.data||[]).forEach(x=>last[x.email]=last[x.email]||x);
 $("ut").innerHTML="<tr><th>Utilisateur</th><th>Rôle</th><th>Compte</th><th>Mot de passe</th></tr>"+r.data.map(u=>{const me=u.id===user.id,em=u.email||"";return `<tr><td>${esc([u.prenom,u.nom].filter(Boolean).join(" ")||"—")}<br><small class="mu">${esc(em||u.id)}</small></td><td><select data-u="${u.id}" ${me?"disabled":""}>${ROLES.map(x=>`<option ${x===u.role?"selected":""}>${x}</option>`).join("")}</select></td><td><select data-a="${u.id}" ${me?"disabled":""}><option value="1" ${u.actif!==false?"selected":""}>Actif</option><option value="0" ${u.actif===false?"selected":""}>Désactivé</option></select></td><td>${em&&!me?`<button class="btn s o" data-p="${esc(em)}">Réinitialiser</button>`:""}${last[em]?`<br><small class="mu">Dernière demande : ${fmt(last[em].created_at)}</small>`:""}${u.role!=="porteur"&&em?`<br><button class="btn s o" data-j="${esc(em)}" style="margin-top:4px">Activité</button>`:""}</td></tr>`}).join("");
 $("ut").onchange=async e=>{const t=e.target,x=t.dataset.u?await sb.from("profiles").update({role:t.value}).eq("id",t.dataset.u):t.dataset.a?await sb.from("profiles").update({actif:t.value==="1"}).eq("id",t.dataset.a):null;if(x)toast(x.error?"Erreur : "+x.error.message:"Compte mis à jour.")};
 $("ut").onclick=async e=>{const b=e.target.closest("[data-p],[data-j]");if(!b)return;
  if(b.dataset.p){const em=b.dataset.p,x=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.href.split("#")[0]});if(x.error)return toast("Erreur : "+x.error.message);await sb.from("faseca_resets").insert({email:em});toast("Lien de réinitialisation envoyé à "+em+".");tUsr()}
  else{const j=await sb.from("faseca_journal").select("*").eq("acteur",b.dataset.j).order("created_at",{ascending:false}).limit(30);modal(`<h3>Activité de ${esc(b.dataset.j)}</h3>${(j.data||[]).map(x=>`<p style="border-bottom:1px solid var(--bd);margin:0;padding:6px 0">${new Date(x.created_at).toLocaleString("fr-FR")} · <b>${esc(x.operation)}</b> · ${esc(x.numero)}</p>`).join("")||'<p class="mu">Aucune activité enregistrée.</p>'}`)}}}

// ---- Export Excel mis en forme ----
async function xlsx(){
 const wb=new ExcelJS.Workbook();wb.creator="FASECA-KB 2026";
 const thin={style:"thin",color:{argb:"FFDBE5DF"}},bx={top:thin,left:thin,bottom:thin,right:thin},fill=c=>({type:"pattern",pattern:"solid",fgColor:{argb:c}});
 const STC={"Reçue":["FFFFF4C2","FF7A5C00"],"Réservation confirmée":["FFDFF2E5","FF1B5E35"],"Stand attribué":["FFD6E4FF","FF0F2A5C"],"Soldée":["FF1B5E35","FFFFFFFF"],"Liste d'attente":["FFFFE0B2","FF8A4B00"],"Refusée":["FFFDE2E2","FFA31D1D"]};
 const sheet=(name,title,heads,rows,w,stCol)=>{const ws=wb.addWorksheet(name,{views:[{state:"frozen",ySplit:3,showGridLines:false}],pageSetup:{orientation:"landscape",paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0}}),n=heads.length;let c;
  ws.mergeCells(1,1,1,n);c=ws.getCell(1,1);c.value="FASECA-KB 2026 – "+title;c.font={name:"Calibri",size:16,bold:true,color:{argb:"FFFFFFFF"}};c.fill=fill("FF1B5E35");c.alignment={vertical:"middle",indent:1};ws.getRow(1).height=32;
  ws.mergeCells(2,1,2,n);c=ws.getCell(2,1);c.value=`${CFG.dates} · ${CFG.lieu} · généré le ${new Date().toLocaleDateString("fr-FR")} · ${rows.length} ligne(s)`;c.font={name:"Calibri",size:10,italic:true,color:{argb:"FF0F2A5C"}};c.fill=fill("FFF2B705");c.alignment={vertical:"middle",indent:1};ws.getRow(2).height=20;
  heads.forEach((h,i)=>{c=ws.getCell(3,i+1);c.value=h;c.font={name:"Calibri",bold:true,color:{argb:"FFFFFFFF"}};c.fill=fill("FF0F2A5C");c.alignment={horizontal:"center",vertical:"middle",wrapText:true};c.border=bx;ws.getColumn(i+1).width=w[i]});ws.getRow(3).height=26;
  rows.forEach((r,ri)=>r.forEach((x,i)=>{c=ws.getCell(4+ri,i+1);c.value=x===""||x==null?"—":x;c.font={name:"Calibri",size:10};c.border=bx;c.fill=fill(ri%2?"FFF4F7F5":"FFFFFFFF");c.alignment={vertical:"top",wrapText:true,horizontal:typeof x==="number"?"right":"left"};if(typeof x==="number")c.numFmt="#,##0";
   if(i===stCol&&STC[x]){c.fill=fill(STC[x][0]);c.font={name:"Calibri",size:10,bold:true,color:{argb:STC[x][1]}};c.alignment={vertical:"top",horizontal:"center"}}}));
  if(rows.length)ws.autoFilter={from:{row:3,column:1},to:{row:3+rows.length,column:n}}};
 const act=ROWS.filter(x=>!["Refusée","Liste d'attente"].includes(x.statut));
 if(!VIEW.length)VIEW=ROWS;
 sheet("Exposants","Liste des exposants",["N° dossier","Date","Entreprise / organisation","Responsable","Secteur(s)","Téléphone","Commune","E-mail","Formule","Statut","Tarif (Fcfa)","Versé (Fcfa)","Reste (Fcfa)","N° stand","Paiement prévu","Produits exposés"],
  VIEW.map(x=>[x.numero,fmt(x.created_at),x.organisation,x.responsable,(x.secteurs||[]).join(", "),x.telephone,x.commune,x.email,pn(x.formule),x.statut,price(x.formule),x.montant_verse||0,Math.max(0,price(x.formule)-(x.montant_verse||0)),x.stand,x.mode_paiement,x.produits]),[18,12,30,24,24,18,20,30,26,22,14,14,14,10,22,44],9);
 const syn=[["Inscriptions reçues",ROWS.length,""],["Stands retenus (hors refus / attente)",act.length,""],...STAT.map(s=>["Statut : "+s,ROWS.filter(x=>x.statut===s).length,""]),
  ...Object.keys(PK).map(k=>["Formule : "+pn(k),ROWS.filter(x=>x.formule===k).length,ROWS.filter(x=>x.formule===k).reduce((a,x)=>a+(x.montant_verse||0),0)]),
  ...SECT.map(s=>["Secteur : "+s,ROWS.filter(x=>(x.secteurs||[]).includes(s)).length,""]),
  ["TOTAL ENCAISSÉ (Fcfa)","",ROWS.reduce((a,x)=>a+(x.montant_verse||0),0)],["RESTE À ENCAISSER (Fcfa)","",Math.max(0,act.reduce((a,x)=>a+price(x.formule),0)-ROWS.reduce((a,x)=>a+(x.montant_verse||0),0))]];
 sheet("Synthèse","Synthèse",["Indicateur","Exposants","Montant encaissé (Fcfa)"],syn,[46,14,26],-1);
 const buf=await wb.xlsx.writeBuffer(),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));a.download="FASECA-KB-exposants-"+new Date().toISOString().slice(0,10)+".xlsx";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function recovery(){nav();v(`<form class="card" id="rc" style="max-width:420px;margin:30px auto"><h2>Nouveau mot de passe</h2><label>Nouveau mot de passe (8 caractères min., lettres et chiffres)<input name="p" type="password" minlength="8" maxlength="72" required autocomplete="new-password"></label><div class="err" id="e"></div><button class="btn" style="width:100%">Enregistrer</button></form>`);$("rc").onsubmit=async e=>{e.preventDefault();const p=new FormData($("rc")).get("p");if(!pwOK(p))return $("e").textContent="Mot de passe trop faible.";const x=await sb.auth.updateUser({password:p});if(x.error)return $("e").textContent=x.error.message;toast("Mot de passe modifié.");boot()}}
sb.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY")setTimeout(recovery,0)});
window.addEventListener("unhandledrejection",e=>toast("Erreur : "+(e.reason?.message||e.reason)));
boot();
