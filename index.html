<title>FASECA-KB 2026 – Opportunité Commerciale Rurale · Inscription des exposants</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js" integrity="sha384-Pqp51FUN2/qzfxZxBCtF0stpc9ONI6MYZpVqmo8m20SoaQCzf+arZvACkLkirlPz" crossorigin="anonymous"></script>
<style>
:root{--g:#1b5e35;--g2:#2f8f55;--gl:#e9f5ee;--n:#0f2a5c;--y:#f2b705;--r:#c62828;--ink:#14281d;--mu:#5f7168;--bg:#f3f6f4;--card:#fff;--bd:#e0e8e3;--sh:0 1px 2px rgba(15,42,92,.06),0 8px 24px rgba(15,42,92,.07);--rad:16px}
@media(prefers-color-scheme:dark){:root{--ink:#e8f1ec;--mu:#9fb3a7;--bg:#0c1511;--card:#14231b;--bd:#244031;--gl:#183325;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:radial-gradient(1200px 500px at 85% -10%,rgba(242,183,5,.12),transparent),var(--bg);color:var(--ink);line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
img{max-width:100%}a{color:var(--g2)}
header{position:sticky;top:0;z-index:20;background:rgba(15,42,92,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;padding:10px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:3px solid var(--y)}
.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.brand b{font-size:18px;letter-spacing:.3px;display:block}.brand small{opacity:.8;font-size:12px}
nav{display:flex;gap:8px;flex-wrap:wrap}
main{width:100%;max-width:1000px;margin:0 auto;padding:20px 18px;flex:1;min-width:0}
footer{text-align:center;color:var(--mu);font-size:13px;padding:18px 12px;border-top:1px solid var(--bd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--rad);padding:22px;margin:16px 0;box-shadow:var(--sh);min-width:0;overflow-wrap:anywhere}
.card h2,.card h3{margin:0 0 12px;color:var(--g);letter-spacing:-.2px}.card h2{font-size:22px}
.banner{background:linear-gradient(135deg,var(--n),#1a4b96 70%,#1b5e35);color:#fff;border:0;position:relative;overflow:hidden}
.banner:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(242,183,5,.35),transparent 70%)}
.banner h2{color:var(--y);font-size:clamp(20px,4vw,28px)}.banner p{margin:4px 0;opacity:.95}
.wrap{display:grid;grid-template-columns:270px 1fr;gap:22px;align-items:start}.wrap aside{position:sticky;top:86px;padding-top:16px}
.fly{width:100%;display:block;border-radius:var(--rad);border:3px solid var(--y);box-shadow:0 10px 30px rgba(15,42,92,.3)}
label{display:block;font-size:14px;font-weight:600;color:var(--ink)}
input,select,textarea{width:100%;max-width:100%;padding:11px 13px;margin:6px 0 14px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:16px;font-weight:400;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--g2);box-shadow:0 0 0 4px rgba(47,143,85,.18)}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:0 16px}
.chk{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}.chk label{display:flex;align-items:center;gap:8px;font-weight:500;padding:8px 14px;border:1.5px solid var(--bd);border-radius:99px;cursor:pointer}.chk label:has(input:checked){background:var(--gl);border-color:var(--g2);color:var(--g)}.chk input{width:auto;margin:0}
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:14px}
.pack{display:block;border:2px solid var(--bd);border-radius:var(--rad);padding:16px;cursor:pointer;font-weight:400;transition:transform .15s,border-color .15s,box-shadow .15s;background:var(--card)}
.pack:hover{transform:translateY(-2px);box-shadow:var(--sh)}.pack.on{border-color:var(--g2);background:var(--gl);box-shadow:0 0 0 4px rgba(47,143,85,.15)}
.pack b{font-size:24px;color:var(--g);display:block;margin:2px 0}.pack ul{margin:8px 0;padding-left:18px;font-size:14px}.pack small{color:var(--mu)}.pack input{width:auto;margin:0 8px 0 0}
.btn{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border:0;padding:12px 22px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;box-shadow:0 4px 14px rgba(27,94,53,.3);transition:transform .15s,box-shadow .15s,opacity .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(27,94,53,.35)}.btn:active{transform:none}.btn:focus-visible{outline:3px solid var(--y);outline-offset:2px}.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.btn.y{background:linear-gradient(135deg,var(--y),#ffd45a);color:#14281d;box-shadow:0 4px 14px rgba(242,183,5,.4)}.btn.o{background:transparent;color:inherit;border:1.5px solid currentColor;box-shadow:none}.btn.s{padding:8px 14px;font-size:13px;border-radius:10px}.tabs .on{background:linear-gradient(135deg,var(--n),#1a4b96)}
form>.btn{width:100%;font-size:17px;padding:14px}
.err{color:var(--r);min-height:20px;font-size:14px;font-weight:600}.ok{color:var(--g2);font-weight:600}.mu{color:var(--mu)}
.pwr{display:flex;gap:8px;align-items:center}.pwr input{margin:6px 0}.meter{display:flex;gap:4px;margin:0 0 4px}.meter:before,.meter:after,.meter i{content:"";flex:1;height:5px;border-radius:5px;background:var(--bd)}.meter i{display:block}
.meter[data-s="1"]:before{background:#e53935}.meter[data-s="2"]:before,.meter[data-s="2"] i{background:#fb8c00}.meter[data-s="3"]:before,.meter[data-s="3"] i{background:#fdd835}.meter[data-s="4"]:before,.meter[data-s="4"] i,.meter[data-s="4"]:after{background:#2fa84f}.meter[data-s="3"]:after{background:#fdd835}.meter[data-s="2"]:after{background:var(--bd)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.steps{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.st{flex:1;min-width:130px;display:flex;gap:10px;align-items:center;font-size:13px;font-weight:600}
.st i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:var(--bd);color:var(--mu);font-weight:800;flex:none}
.st.ok i{background:#2fa84f;color:#fff}.st.cur i{background:var(--n);color:#fff;box-shadow:0 0 0 5px rgba(15,42,92,.15)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:12px;margin:14px 0}
.kp>div{background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--y);border-radius:14px;padding:14px;box-shadow:var(--sh)}.kp small{color:var(--mu);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.5px}.kp b{font-size:26px;display:block;line-height:1.2}
table{border-collapse:collapse;width:100%;font-size:14px}th{background:var(--gl);color:var(--g);font-size:12px;text-transform:uppercase;letter-spacing:.4px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--bd);vertical-align:top}tr:hover td{background:rgba(47,143,85,.04)}td input,td select{margin:0;padding:7px;font-size:14px}
.chip{display:inline-block;padding:3px 12px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.c1{background:#fff4c2;color:#7a5c00}.c2{background:#dff2e5;color:#1b5e35}.c3{background:#d6e4ff;color:#0f2a5c}.c4{background:#1b5e35;color:#fff}.c5{background:#ffe0b2;color:#8a4b00}.c6{background:#fde2e2;color:#a31d1d}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}.info div{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.info div:last-child{border:0}.info b{width:200px;flex:none;color:var(--mu);font-weight:600}
#tt{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);background:var(--n);color:#fff;padding:12px 20px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:all .25s;z-index:50;width:max-content;max-width:92vw}#tt.show{opacity:1;transform:translate(-50%,0)}
.w{grid-column:1/-1}.btn.d{background:var(--r);box-shadow:none}
.hero{border-radius:20px;overflow:hidden;background:linear-gradient(135deg,var(--n),#1a4b96 70%,#1b5e35);box-shadow:var(--sh);margin-bottom:18px}
.aff{position:relative;margin:0;aspect-ratio:16/9;overflow:hidden;background:var(--n);animation:affIn 1.1s cubic-bezier(.2,.8,.2,1) both}
.aff img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;animation:affZoom 9s ease-in-out infinite alternate}
.aff:after{content:"";position:absolute;top:-20%;bottom:-20%;left:-40%;width:22%;transform:skewX(-18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:affShine 5s ease-in-out 1.2s infinite;pointer-events:none}
.aff.card-aff{border-radius:var(--rad);border:3px solid var(--y);box-shadow:var(--sh);margin:16px 0}
.sl{display:grid}.sl .aff{grid-area:1/1;opacity:0;visibility:hidden;transition:opacity 1s,visibility 1s;animation:none}.sl .aff.on{opacity:1;visibility:visible;animation:affIn 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes affIn{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
@keyframes affZoom{from{transform:scale(1)}to{transform:scale(1.035)}}
@keyframes affShine{0%{left:-40%}45%,100%{left:130%}}
.ov{padding:clamp(18px,4vw,34px);color:#fff;animation:affIn 1s .35s both}.ov h1{margin:8px 0;font-size:clamp(24px,4.5vw,40px);line-height:1.15;color:var(--y)}.ov p{margin:6px 0 14px;font-size:clamp(14px,2vw,17px)}.kick{background:rgba(255,255,255,.16);padding:4px 12px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.5px}
.ttl{letter-spacing:.5px;font-size:18px!important}
.adm{display:grid;grid-template-columns:210px 1fr;gap:16px;margin-top:14px}.side{display:flex;flex-direction:column;gap:6px;position:sticky;top:80px;align-self:start}.side .btn{text-align:left}.side .btn:not(.on){background:transparent;color:var(--ink);box-shadow:none;border:1.5px solid var(--bd)}
.bars div{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.bars span{width:150px;flex:none}.bars i{display:block;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--g),var(--g2))}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.ph div{position:relative}.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block}.ph .btn{position:absolute;top:4px;right:4px;padding:4px 9px}
dialog{border:0;border-radius:16px;max-width:780px;width:94vw;max-height:90vh;overflow:auto;background:var(--card);color:var(--ink);box-shadow:var(--sh);padding:20px}dialog::backdrop{background:rgba(8,20,40,.55)}
@media(max-width:760px){.adm{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto;position:static}.side .btn{white-space:nowrap}.bars span{width:100px}}
@media(prefers-reduced-motion:reduce){.aff,.aff.on,.aff img,.aff:after,.ov{animation:none!important}.aff:after{display:none}}
.hide{display:none!important}
.pwr .btn{flex:none}td .btn,td .chip{white-space:nowrap}
details{margin:0 0 14px}summary{cursor:pointer;font-weight:700;color:var(--g);padding:8px 0}
.prog{display:flex;gap:6px;margin:0 0 16px}.prog span{flex:1;font-size:12px;font-weight:700;color:var(--mu);border-top:5px solid var(--bd);padding-top:6px;border-radius:3px}.prog span.on{border-color:var(--g2);color:var(--g)}
.recap{background:var(--gl);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px}.row{display:flex;gap:8px;flex-wrap:wrap}
#pr{display:none}.doc{font-size:13px;color:#000}.doc h1{font-size:18px;margin:0 0 4px}.doc td,.doc th{border:1px solid #999;color:#000;background:#fff}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8mm}.badge{border:2px solid #0f2a5c;border-radius:10px;padding:14px;text-align:center;break-inside:avoid;min-height:60mm}.badge b{display:block;font-size:18px;margin:8px 0}
@media(max-width:760px){header{padding:10px 12px}.brand b{font-size:16px}nav{width:100%}nav .btn{flex:1;text-align:center}main{padding:12px}.card{padding:16px}.wrap{grid-template-columns:1fr}.wrap aside{position:static;max-width:230px;margin:0 auto}.kp b{font-size:20px}.steps{flex-direction:column}.st{min-width:0}.info div{flex-direction:column;gap:2px}.info b{width:auto}.tabs .btn{flex:1}
#t tr:first-child{display:none}#t tr{display:block;border:1px solid var(--bd);border-radius:12px;margin:12px 0;padding:6px}#t td{display:block;border:0;padding:5px 8px}#t td input,#t td select{width:100%!important}
#ut tr{display:flex;justify-content:space-between;gap:8px;align-items:center}#ut tr:first-child{display:none}#ut td{border:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{body.imp>*{display:none!important}body.imp>#pr{display:block!important}body.imp{background:#fff}.aff:after{display:none}header,footer,nav,.btn{display:none!important}}

async function submit(){
 if(PREVIEW)return toast("Aperçu : l'inscription est désactivée.");
 const f=new FormData($("f")),g=k=>String(f.get(k)||"").trim(),err=m=>{$("nx").disabled=false;$("e").textContent=m};
 if(g("website"))return;
 const pw=String(f.get("pw")||"");
 if(!user&&!pwOK(pw))return err("Mot de passe trop faible : 8 caractères minimum, avec lettres et chiffres.");
 if(!user&&pw!==f.get("pw2"))return err("Les deux mots de passe ne sont pas identiques.");
 const row={...collect(f),email:(user?user.email:g("email")).toLowerCase(),formule:g("formule"),mode_paiement:g("mode_paiement")};
 if(!/^\+?[0-9 ().-]{9,18}$/.test(row.telephone)){step(1);return err("Numéro de téléphone invalide.")}
 if(f.getAll("photos").filter(x=>x&&x.size).length>5)return err("5 photos maximum pour les produits / l'activité.");
 $("nx").disabled=true;$("e").textContent="";
 if(!user){
  const {data,error}=await sb.auth.signUp({email:row.email,password:pw,options:{data:{nom:row.responsable,telephone:row.telephone}}});
  let s=data?.session;
  if(!s){
   // compte déjà créé (nouvel essai) ou session non renvoyée : connexion avec les mêmes identifiants
   const r=await sb.auth.signInWithPassword({email:row.email,password:pw});s=r.data?.session;
   if(!s){
    if(data?.user?.identities?.length===0||/already/i.test(error?.message||""))return err("Un compte existe déjà avec cet e-mail : utilisez « Accéder à mon espace ».");
    if(error)return err("Inscription impossible : "+error.message);
    try{localStorage.setItem("faseca_pending_"+row.email,JSON.stringify(row))}catch{}
    return login("Compte créé. Confirmez votre e-mail, puis connectez-vous : votre inscription sera enregistrée (vous pourrez alors ajouter vos photos).")}
  }
  user=s.user;nav();idle();
 }
 const old=await sb.from("faseca_inscriptions").select("id,email").eq("email",row.email).limit(1);
 if(!old.error&&old.data?.length)return boot();
 const ins=await sb.from("faseca_inscriptions").insert(row).select().single();
 if(ins.error)return err("Enregistrement impossible : "+ins.error.message);
 const fl=[f.get("photo_main"),...f.getAll("photos")].filter(x=>x&&x.size);
 let manque=0;
 if(fl.length){try{const ph=await upPhotos(fl,user.id);manque=fl.length-ph.length;if(ph.length){const u=await sb.from("faseca_inscriptions").update({photos:ph}).eq("id",ins.data.id);if(u.error)manque=fl.length}}catch{manque=fl.length}}
 try{sessionStorage.removeItem(BR)}catch{}
 await boot();
 toast(manque?"Inscription enregistrée. Certaines photos n'ont pas été envoyées : ajoutez-les depuis votre espace.":"Inscription enregistrée. Bienvenue dans votre espace !")}
function login(msg){nav();v(`<form class="card" id="l" style="max-width:420px;margin:30px auto"><h2>Mon espace</h2><label>E-mail<input name="e" type="email" required></label><label>Mot de passe<input name="p" type="password" required></label><div class="err ${msg?"ok":""}" id="e">${esc(msg||"")}</div><button class="btn" style="width:100%">Se connecter</button><p style="text-align:center"><a href="#" id="fg">Mot de passe oublié ?</a></p><p style="text-align:center"><a href="#" id="nf2">Pas encore inscrit ? Remplir le formulaire</a></p></form>`);

const lim=(p,ms=8000)=>{let t;return Promise.race([p,new Promise((_,ko)=>t=setTimeout(()=>ko(new Error("le serveur ne répond pas")),ms))]).finally(()=>clearTimeout(t))};

async function charger(){
 clearInterval(HT);
 // premier affichage immédiat, sans attendre le serveur

 try{const c=await lim(sb.from("faseca_config").select("data").eq("id",1).maybeSingle());if(c.data?.data)Object.assign(CFG,c.data.data)}catch{}
 const {data:{session}}=await lim(sb.auth.getSession());
 if(!session){user=null;if(debut&&($("f")!==avant||touche))return;return form()}user=session.user;nav();idle();
 prof=(await sb.from("profiles").select("role,actif").eq("id",user.id).maybeSingle()).data||{};

 const k="faseca_pending_"+(user.email||"").toLowerCase(),raw=(()=>{try{return localStorage.getItem(k)}catch{return null}})();if(raw){const d=await sb.from("faseca_inscriptions").select("id").eq("email",user.email.toLowerCase()).limit(1),r=d.data?.length?{}:await sb.from("faseca_inscriptions").insert(JSON.parse(raw));if(!r.error)localStorage.removeItem(k)}

 if(error)return v(`<div class="card err">Impossible de charger votre dossier : ${esc(error.message)}<br><button class="btn s" onclick="location.reload()">Réessayer</button></div>`);
 data?.[0]?dash(data[0]):form()}

async function xlsx(){
 const wb=new ExcelJS.Workbook();wb.creator="FASECA-KB 2026";

  heads.forEach((h,i)=>{c=ws.getCell(3,i+1);c.value=h;c.font={name:"Calibri",bold:true,color:{argb:"FFFFFFFF"}};c.fill=fill("FF0F2A5C");c.alignment={horizontal:"center",vertical:"middle",wrapText:true};c.border=bx;ws.getColumn(i+1).width=w[i]});ws.getRow(3).height=26;

   if(i===stCol&&STC[x]){c.fill=fill(STC[x][0]);c.font={name:"Calibri",size:10,bold:true,color:{argb:STC[x][1]}};c.alignment={vertical:"top",horizontal:"center"}}}));

 if(!VIEW.length)VIEW=ROWS;
 sheet("Exposants","Liste des exposants",["N° dossier","Date","Entreprise / organisation","Responsable","Secteur(s)","Téléphone","Commune","E-mail","Formule","Statut","Tarif (Fcfa)","Versé (Fcfa)","Reste (Fcfa)","N° stand","Paiement prévu","Produits exposés",...XF.map(f=>f[1])],
  VIEW.map(x=>[x.numero,fmt(x.created_at),x.organisation,x.responsable,(x.secteurs||[]).join(", "),x.telephone,x.commune,x.email,pn(x.formule),x.statut,price(x.formule),x.montant_verse||0,["Refusée","Liste d'attente"].includes(x.statut)?0:Math.max(0,price(x.formule)-(x.montant_verse||0)),x.stand,x.mode_paiement,x.produits,...XF.map(f=>x.details?.[f[0]])]),[18,12,30,24,24,18,20,30,26,22,14,14,14,10,22,44,...XF.map(()=>24)],9);
 const syn=[["Inscriptions reçues",ROWS.length,""],["Stands retenus (hors refus / attente)",act.length,""],...STAT.map(s=>["Statut : "+s,ROWS.filter(x=>x.statut===s).length,""]),
  ...Object.keys(PK).map(k=>["Formule : "+pn(k),ROWS.filter(x=>x.formule===k).length,ROWS.filter(x=>x.formule===k).reduce((a,x)=>a+(x.montant_verse||0),0)]),
  ...SECT.map(s=>["Secteur : "+s,ROWS.filter(x=>(x.secteurs||[]).includes(s)).length,""]),
  ["TOTAL ENCAISSÉ (Fcfa)","",ROWS.reduce((a,x)=>a+(x.montant_verse||0),0)],["RESTE À ENCAISSER (Fcfa)","",act.reduce((a,x)=>a+Math.max(0,price(x.formule)-(x.montant_verse||0)),0)]];
 sheet("Synthèse","Synthèse",["Indicateur","Exposants","Montant encaissé (Fcfa)"],syn,[46,14,26],-1);
 const buf=await wb.xlsx.writeBuffer(),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));a.download="FASECA-KB-exposants-"+new Date().toISOString().slice(0,10)+".xlsx";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function recovery(){nav();v(`<form class="card" id="rc" style="max-width:420px;margin:30px auto"><h2>Nouveau mot de passe</h2><label>Nouveau mot de passe (8 caractères min., lettres et chiffres)<input name="p" type="password" minlength="8" maxlength="72" required autocomplete="new-password"></label><div class="err" id="e"></div><button class="btn" style="width:100%">Enregistrer</button></form>`);$("rc").onsubmit=async e=>{e.preventDefault();const p=new FormData($("rc")).get("p");if(!pwOK(p))return $("e").textContent="Mot de passe trop faible.";const x=await sb.auth.updateUser({password:p});if(x.error)return $("e").textContent=x.error.message;toast("Mot de passe modifié.");boot()}}

RECOV?recovery():boot();
